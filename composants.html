  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F3FBE3; color: #1C2610; -webkit-font-smoothing: antialiased; }

<script>
window.__TEMPLATE__ = "\n\n\n<div style=\"width: 1120px; height: 2093px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; background: #F3FBE3; overflow: hidden\">\n\n  <div>\n    <h1 style=\"margin: 0 0 4px 0; font-size: 24px; font-weight: 700; letter-spacing: 0\">Composants — Nostress</h1>\n    <div style=\"font-size: 12px; color: #5A6B4A\">Les briques assemblées dans les écrans, avec leurs états. Les couleurs et les champs sont sur la planche Fondations ; ici, ce qu’on construit avec.</div>\n  </div>\n\n  <!-- ============ 1. BARRE SUPERIEURE ============ -->\n  <div class=\"card\" style=\"padding: 16px 18px\">\n    <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Barre supérieure</div><span class=\"src\">Main · 64 px</span></div>\n    <div class=\"hs\">Marque à gauche, recherche globale en pilule, horodatage en mono, profil connecté en pilule pleine.</div>\n    <div style=\"height: 64px; background: #DDF3AE; border-radius: 14px; display: flex; align-items: center; padding: 0 22px; gap: 18px\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #4A8C14; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F3FBE3\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21V8l9-5 9 5v13\"></path><path d=\"M3 13h18\"></path><path d=\"M9 21v-5h6v5\"></path></svg>\n        </span>\n        <div style=\"display: flex; flex-direction: column; line-height: 1.05\">\n          <span class=\"dsp\" style=\"color: #1C2610; font-size: 21px; letter-spacing: 0.01em\">Nostress</span>\n          <span style=\"color: #6F9448; font-size: 9px; font-weight: 600; letter-spacing: 0.11em\">GRAND-POPO</span>\n        </div>\n      </div>\n      <div style=\"display: flex; align-items: center; gap: 9px; background: #FFFFFF; border-radius: 999px; padding: 9px 16px; width: 320px\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8AA06E\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"></circle><path d=\"M20 20l-3.5-3.5\"></path></svg>\n        <span style=\"color: #8AA06E; font-size: 12px\">Dossier, client, n° commande, chambre…</span>\n      </div>\n      <div style=\"flex-grow: 1\"></div>\n      <div class=\"num\" style=\"display: flex; align-items: center; gap: 7px; color: #5A6B4A; font-size: 12px; font-weight: 500\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6F9448\" stroke-width=\"1.9\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg>\n        <span>Jeu 15/10/2026 · 09:14</span>\n      </div>\n      <div style=\"display: flex; align-items: center; gap: 8px; background: #4A8C14; border-radius: 999px; padding: 8px 15px 8px 9px\">\n        <span style=\"width: 24px; height: 24px; border-radius: 999px; background: #6BB02A; display: flex; align-items: center; justify-content: center\">\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F3FBE3\" stroke-width=\"2\"><path d=\"M4 20a8 8 0 0116 0\"></path><circle cx=\"12\" cy=\"8\" r=\"4\"></circle></svg>\n        </span>\n        <span style=\"color: #FFFFFF; font-size: 12.5px; font-weight: 600\">Direction générale</span>\n        <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C4E39A\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 9l6 6 6-6\"></path></svg>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ 2-5. NAVIGATION, EN-TETE, ONGLETS, ALERTES ============ -->\n  <div style=\"display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px\">\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Menu latéral</div><span class=\"src\">Main · 226 px</span></div>\n      <div class=\"hs\">Actif en pilule verte pleine. Le compteur orange compte les décisions DG en attente dans le module.</div>\n      <div class=\"stage\" style=\"padding: 12px 10px\">\n        <div style=\"background: #FFFFFF; border-radius: 20px; padding: 16px 12px\">\n          <div class=\"lbl\" style=\"padding: 0 8px 8px 8px\">Exploitation</div>\n          <sc-for list=\"{{nav}}\" as=\"item\" hint-placeholder-count=\"5\">\n            <div style=\"display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 3px; border-radius: 999px; background: {{item.bg}}; color: {{item.fg}}; font-size: 13px; font-weight: {{item.weight}}\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{item.stroke}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{item.icon}}\"></path></svg>\n              <span style=\"flex-grow: 1\">{{item.label}}</span>\n              <sc-if value=\"{{item.badge}}\" hint-placeholder-val=\"{{true}}\">\n                <span class=\"num\" style=\"background: {{item.badgeBg}}; color: {{item.badgeFg}}; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px\">{{item.badge}}</span>\n              </sc-if>\n            </div>\n          </sc-for>\n          <div style=\"border-top: 1px solid #E9F4D6; padding-top: 12px; margin-top: 12px\">\n            <div class=\"lbl\" style=\"padding: 0 8px 8px 8px\">Sauvegarde</div>\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 0 8px 6px 8px\">\n              <span style=\"width: 7px; height: 7px; border-radius: 50%; background: #4A8C14; flex-shrink: 0\"></span>\n              <span style=\"font-size: 11px; color: #5A6B4A\">Serveur MG synchro satellite</span>\n            </div>\n            <div class=\"num\" style=\"padding: 0 8px; font-size: 11px; color: #8AA06E\">Dernière synchro 08:47</div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <div style=\"display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n      <div class=\"card\" style=\"padding: 16px 18px\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">En-tête d’écran et onglets accolés</div><span class=\"src\">Main · tous les modules</span></div>\n        <div class=\"hs\">Titre Baloo 2 à 24 px, une phrase qui dit l’enjeu, actions à droite (secondaire puis principale). Les onglets accolés basculent une vue ; l’actif est en encre pleine.</div>\n        <div class=\"stage\" style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 16px\">\n          <div>\n            <h1 style=\"margin: 0 0 3px 0; font-size: 24px\">Planning</h1>\n            <div style=\"font-size: 12px; color: #5A6B4A; white-space: nowrap\">Semaine 42 · 12 au 18 octobre 2026</div>\n          </div>\n          <div style=\"display: flex; gap: 8px; align-items: center\">\n            <div style=\"display: flex; background: #FFFFFF; border: 1px solid #CFE4AE; border-radius: 12px; overflow: hidden\">\n              <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n                <div style=\"white-space: nowrap; padding: 7px 14px; font-size: 12px; font-weight: {{t.weight}}; background: {{t.bg}}; color: {{t.fg}}; border-right: {{t.br}}\">{{t.label}}</div>\n              </sc-for>\n            </div>\n            <button style=\"background: #FFFFFF; border: 1px solid #CFE4AE; color: #1C2610; font-size: 12px; font-weight: 500; padding: 7px 13px; border-radius: 999px; white-space: nowrap\">Exporter</button>\n            <button style=\"background: #4A8C14; color: #FFFFFF; font-size: 12px; font-weight: 500; padding: 7px 13px; border-radius: 999px; white-space: nowrap\">Nouvelle réservation</button>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"card\" style=\"padding: 16px 18px; flex-grow: 1\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Liste d’alertes</div><span class=\"src\">Main · tableau de bord</span></div>\n        <div class=\"hs\">Un point de 6 px donne la gravité : rouge pour une règle enfreinte, orange pour ce qui attend quelqu’un, bleu pour l’information.</div>\n        <div style=\"border: 1px solid #DCEBC2; border-radius: 16px; overflow: hidden\">\n          <div style=\"padding: 12px 15px; border-bottom: 1px solid #E9F4D6; display: flex; align-items: center; gap: 8px\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M12 8v5\"></path><path d=\"M12 17h.01\"></path><circle cx=\"12\" cy=\"12\" r=\"9\"></circle></svg>\n            <span style=\"font-size: 13px; font-weight: 600\">Alertes système</span>\n          </div>\n          <sc-for list=\"{{alerts}}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 10px 15px; border-bottom: 1px solid #F0F8E2; display: flex; gap: 10px; align-items: flex-start\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: {{a.color}}; margin-top: 5px; flex-shrink: 0\"></span>\n              <div style=\"flex-grow: 1\">\n                <div style=\"font-size: 12px; font-weight: 500; line-height: 1.35\">{{a.title}}</div>\n                <div style=\"font-size: 11px; color: #8AA06E; margin-top: 2px\">{{a.meta}}</div>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n    </div>\n  </div>\n\n  <!-- ============ 6. TUILES ============ -->\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Tuiles d’indicateurs</div><span class=\"src\">Main · tableau de bord</span></div>\n      <div class=\"hs\">Pas de bordure, rayon 20 px. Lime pour l’activité, vert plein pour la trésorerie, orange seulement quand des décisions attendent le DG — et vert pâle quand il n’y en a plus.</div>\n      <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px\">\n        <sc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"4\">\n          <div style=\"background: {{k.tile}}; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px\">\n            <div class=\"lbl\" style=\"color: {{k.lblColor}}\">{{k.label}}</div>\n            <div class=\"num\" style=\"font-size: 27px; font-weight: 700; letter-spacing: -0.02em; color: {{k.color}}\">{{k.value}}</div>\n            <div style=\"font-size: 11.5px; color: {{k.noteColor}}\">{{k.note}}</div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n  <!-- ============ 7. VALIDATION DG + 10. PROCEDURE ============ -->\n  <div style=\"display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Ligne de validation DG</div><span class=\"src\">Main · tableau de bord</span></div>\n      <div class=\"hs\">Le filet de 3 px porte le type de pièce. En attente : Refuser / Valider. Une fois décidée, la ligne garde sa trace sous forme de pastille.</div>\n      <div style=\"border: 1px solid #DCEBC2; border-radius: 16px; overflow: hidden\">\n        <div style=\"padding: 13px 15px; border-bottom: 1px solid #E9F4D6; display: flex; align-items: center; gap: 9px\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D4711C\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 11l3 3 8-8\"></path><path d=\"M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9\"></path></svg>\n          <span style=\"font-size: 13px; font-weight: 600\">En attente de validation DG</span>\n          <span class=\"num\" style=\"background: #FDEEDC; color: #9C4E0B; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px\">2</span>\n        </div>\n        <sc-for list=\"{{validations}}\" as=\"v\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 13px 15px; border-bottom: 1px solid #F0F8E2; display: flex; gap: 13px; align-items: flex-start\">\n            <div style=\"width: 3px; align-self: stretch; border-radius: 6px; background: {{v.accent}}; flex-shrink: 0\"></div>\n            <div style=\"flex-grow: 1; min-width: 0\">\n              <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 3px\">\n                <span class=\"num\" style=\"font-size: 11px; color: #8AA06E\">{{v.ref}}</span>\n                <span style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{v.accent}}\">{{v.kind}}</span>\n              </div>\n              <div style=\"font-size: 13px; font-weight: 600; margin-bottom: 3px\">{{v.title}}</div>\n              <div style=\"font-size: 12px; color: #5A6B4A; line-height: 1.45\">{{v.detail}}</div>\n            </div>\n            <div style=\"text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px\">\n              <div class=\"num\" style=\"font-size: 15px; font-weight: 600\">{{v.amount}}</div>\n              <sc-if value=\"{{v.pending}}\" hint-placeholder-val=\"{{true}}\">\n                <div style=\"display: flex; gap: 6px\">\n                  <button style=\"background: #FFFFFF; border: 1px solid #F2C9C2; color: #C0392B; font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 999px\">Refuser</button>\n                  <button style=\"background: #4A8C14; color: #FFFFFF; font-size: 12px; font-weight: 500; padding: 5px 13px; border-radius: 999px\">Valider</button>\n                </div>\n              </sc-if>\n              <sc-if value=\"{{v.decided}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"display: flex; align-items: center; gap: 6px; background: {{v.badgeBg}}; color: {{v.badgeFg}}; border: 1px solid {{v.badgeBd}}; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px\">{{v.badgeLabel}}</div>\n              </sc-if>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\"><div class=\"h\">Suivi de procédure</div><span class=\"src\">Main · accueil</span></div>\n      <div class=\"hs\">Chaque étape se coche d’un clic ; faite, elle est barrée sur fond lime pâle. L’étiquette de droite dit qui la porte.</div>\n      <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px\">\n        <span style=\"font-size: 13px; font-weight: 600\">Procédure — cas 2</span>\n        <span style=\"flex-grow: 1\"></span>\n        <span class=\"num\" style=\"font-size: 11px; color: #8AA06E\">2 / 4 étapes</span>\n      </div>\n      <div style=\"height: 6px; background: #E9F4D6; border-radius: 999px; overflow: hidden; margin-bottom: 10px\"><div style=\"height: 100%; width: 50%; background: #4A8C14\"></div></div>\n      <div style=\"display: flex; flex-direction: column; gap: 2px\">\n        <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: flex-start; gap: 11px; padding: 9px 10px; border-radius: 999px; background: {{s.rowBg}}\">\n            <span style=\"width: 17px; height: 17px; border-radius: 4px; border: 1.5px solid {{s.boxBd}}; background: {{s.boxBg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px\">\n              <sc-if value=\"{{s.done}}\" hint-placeholder-val=\"{{true}}\">\n                <svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.5\" stroke-linecap=\"round\"><path d=\"M5 13l4 4L19
