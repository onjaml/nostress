         <div style=\"flex-grow: 1; font-size: {{t.size}}; font-weight: {{t.weight}}; font-family: {{t.family}}; letter-spacing: {{t.ls}}\">{{t.sample}}</div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"font-size: 11.5px; color: #5A6B4A; margin-top: 11px; line-height: 1.5\">Tous les montants, quantités, références et horaires sont en JetBrains Mono avec chiffres tabulaires : les colonnes de facture et de stock restent alignées quel que soit le chiffre.</div>\n    </div>\n  </div>\n\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"h\">Boutons</div>\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap\">\n          <button style=\"background: #4A8C14; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 8px 17px; border-radius: 999px\">Valider</button>\n          <button style=\"background: #FFFFFF; border: 1px solid #CFE4AE; color: #1C2610; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 999px\">Secondaire</button>\n          <button style=\"background: #FFFFFF; border: 1px solid #F2C9C2; color: #C0392B; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 999px\">Refuser</button>\n          <button style=\"background: #FDEEDC; border: 1px solid #F5D3AE; color: #9C4E0B; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 999px\">+ Ligne</button>\n        </div>\n        <div class=\"lbl\" style=\"margin-top: 4px\">Android — cible minimale 44 px</div>\n        <div style=\"display: flex; gap: 8px\">\n          <button style=\"flex-grow: 1; min-height: 48px; background: #4A8C14; color: #FFFFFF; font-size: 14px; font-weight: 700; border-radius: 999px\">Envoyer</button>\n          <button style=\"flex-grow: 1; min-height: 48px; background: #FFFFFF; border: 1.5px solid #CFE4AE; color: #4E5F3C; font-size: 14px; font-weight: 600; border-radius: 999px\">Annuler</button>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"h\">Sélection</div>\n      <div style=\"display: flex; gap: 7px; margin-bottom: 12px\">\n        <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 7px 14px; border-radius: 12px; font-size: 12px; font-weight: {{t.weight}}; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}}\">{{t.label}}</div>\n        </sc-for>\n      </div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px\">\n        <sc-for list=\"{{checks}}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span style=\"width: 17px; height: 17px; border-radius: {{c.radius}}; border: 1.5px solid {{c.bd}}; background: {{c.bg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center\">\n              <sc-if value=\"{{c.on}}\" hint-placeholder-val=\"{{true}}\">\n                <svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.5\" stroke-linecap=\"round\"><path d=\"M5 13l4 4L19 7\"></path></svg>\n              </sc-if>\n            </span>\n            <span style=\"font-size: 12.5px; color: {{c.fg}}\">{{c.label}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"h\">Statuts</div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 7px\">\n        <sc-for list=\"{{badges}}\" as=\"b\" hint-placeholder-count=\"8\">\n          <span style=\"background: {{b.bg}}; color: {{b.fg}}; border: 1px solid {{b.bd}}; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; padding: 4px 9px; border-radius: 999px\">{{b.label}}</span>\n        </sc-for>\n      </div>\n      <div style=\"font-size: 11.5px; color: #5A6B4A; margin-top: 13px; line-height: 1.5\">Une pastille pleine confirme un fait acquis. Un contour orange demande une action de quelqu’un. Un contour rouge signale une règle enfreinte ou un délai dépassé.</div>\n    </div>\n  </div>\n\n  <div class=\"card\" style=\"padding: 16px 18px\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 13px\">\n      <div class=\"h\" style=\"margin: 0\">Champs de saisie</div>\n      <div style=\"font-size: 11.5px; color: #5A6B4A\">36 px sur PC, 48 px sur Android · rayon 12 px · libellé au-dessus, aide en dessous · classes <span class=\"num\">f-*</span></div>\n    </div>\n\n    <div class=\"f-grid\">\n      <div>\n        <label class=\"f-lbl\">Nom du client <span class=\"req\">*</span></label>\n        <input class=\"f-in\" type=\"text\" placeholder=\"Ex. ONG Sikadi\">\n        <div class=\"f-help\">Texte libre, 120 caractères max.</div>\n      </div>\n      <div>\n        <label class=\"f-lbl\">Prix unitaire HT</label>\n        <div class=\"f-box\"><input class=\"num r\" type=\"text\" inputmode=\"numeric\" value=\"38 000\"><span class=\"f-aff rt\">FCFA</span></div>\n        <div class=\"f-help\">Montant : mono tabulaire, aligné à droite.</div>\n      </div>\n      <div>\n        <label class=\"f-lbl\">Quantité</label>\n        <div class=\"f-step\"><button type=\"button\">−</button><input class=\"f-in num\" type=\"text\" inputmode=\"numeric\" value=\"36\"><button type=\"button\">+</button></div>\n        <div class=\"f-help\">Pas de 1, jamais négatif.</div>\n      </div>\n      <div>\n        <label class=\"f-lbl\">Recherche</label>\n        <div class=\"f-box\"><span class=\"f-ico\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"></circle><path d=\"M20 20l-3.5-3.5\"></path></svg></span><input type=\"search\" placeholder=\"Client, chambre, factur
