le=\"display: flex; align-items: flex-start; gap: 10px\">\n                    <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{e.color}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px\"><path d=\"{{e.icon}}\"></path></svg>\n                    <div style=\"flex-grow: 1\">\n                      <div style=\"font-size: 12.5px; font-weight: 500\">{{e.label}}</div>\n                      <div class=\"num\" style=\"font-size: 11px; color: #8AA06E; margin-top: 1px\">{{e.value}}</div>\n                    </div>\n                  </div>\n                </sc-for>\n              </div>\n            </div>\n          </div>\n\n        </div>\n      </div>\n      </sc-if>\n\n      <!-- ---------- ACHATS & STOCK ---------- -->\n      <sc-if value=\"{{isAchats}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; height: 100%; overflow: auto\">\n\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between\">\n          <div>\n            <h1 style=\"margin: 0 0 3px 0; font-size: 24px; font-weight: 700; letter-spacing: 0\">Achats &amp; stock</h1>\n            <div style=\"font-size: 12px; color: #5A6B4A\">Magasin Grand-Popo &#183; r&#232;gle de r&#233;approvisionnement : stock &#8722; mini &#8722; 1 mois de conso + commande &gt; 0</div>\n          </div>\n          <div style=\"display: flex; background: #FFFFFF; border: 1px solid #CFE4AE; border-radius: 12px; overflow: hidden\">\n            <sc-for list=\"{{achTabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button onClick=\"{{t.go}}\" style=\"padding: 7px 14px; font-size: 12px; font-weight: {{t.weight}}; background: {{t.bg}}; color: {{t.fg}}; border-right: 1px solid #DCEBC2\">{{t.label}}</button>\n            </sc-for>\n          </div>\n        </div>\n\n        <sc-if value=\"{{achIsStock}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"card\" style=\"overflow: hidden\">\n          <table style=\"width: 100%\">\n            <thead>\n              <tr style=\"background: #F6FCEA\">\n                <th class=\"th\" style=\"padding-top: 10px\">Article</th>\n                <th class=\"th\" style=\"padding-top: 10px\">Famille / sous-famille</th>\n                <th class=\"th\" style=\"padding-top: 10px\">Emplacement</th>\n                <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Stock</th>\n                <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Mini</th>\n                <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Conso moy. mensuelle (3 mois)</th>\n                <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Cde en cours</th>\n                <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Couverture</th>\n              </tr>\n            </thead>\n            <tbody>\n              <sc-for list=\"{{stockRows}}\" as=\"s\" hint-placeholder-count=\"8\">\n                <tr style=\"background: {{s.rowBg}}\">\n                  <td class=\"td\" style=\"font-weight: 500\">{{s.name}}</td>\n                  <td class=\"td\" style=\"color: #5A6B4A; font-size: 12px\">{{s.family}}</td>\n                  <td class=\"td\" style=\"color: #5A6B4A; font-size: 12px\">{{s.place}}</td>\n                  <td class=\"td num\" style=\"text-align: right; font-weight: 600\">{{s.stock}}</td>\n                  <td class=\"td num\" style=\"text-align: right; color: #8AA06E\">{{s.mini}}</td>\n                  <td class=\"td num\" style=\"text-align: right; color: #5A6B4A\">{{s.conso}}</td>\n                  <td class=\"td num\" style=\"text-align: right; color: #5A6B4A\">{{s.pending}}</td>\n                  <td class=\"td num\" style=\"text-align: right; font-weight: 600; color: {{s.covColor}}\">{{s.cover}}</td>\n                </tr>\n              </sc-for>\n            </tbody>\n          </table>\n        </div>\n        </sc-if>\n\n        <sc-if value=\"{{achIsPropo}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px\">\n          <div class=\"card\" style=\"overflow: hidden\">\n            <div style=\"padding: 12px 15px; border-bottom: 1px solid #E9F4D6; display: flex; align-items: center; gap: 10px\">\n              <span style=\"font-size: 13px; font-weight: 600\">Proposition automatique &#183; &#201;tablissement Deen</span>\n              <span style=\"font-size: 11px; color: #8AA06E\">g&#233;n&#233;r&#233;e sur alerte stock mini du 06/09</span>\n            </div>\n            <table style=\"width: 100%\">\n              <thead>\n                <tr style=\"background: #F6FCEA\">\n                  <th class=\"th\" style=\"padding-top: 10px\">Article</th>\n                  <th class=\"th\" style=\"padding-top: 10px\">Conditionnement achat</th>\n                  <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Qt&#233; propos&#233;e</th>\n                  <th class=\"th\" style=\"padding-top: 10px; text-align: right\">PU achat</th>\n                  <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Total</th>\n                </tr>\n              </thead>\n              <tbody>\n                <sc-for list=\"{{propoRows}}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <tr>\n                    <td class=\"td\" style=\"font-weight: 500\">{{p.name}}</td>\n                    <td class=\"td\" style=\"color: #5A6B4A; font-size: 12px\">{{p.pack}}</td>\n                    <td class=\"td\" style=\"text-align: right\">\n                      <div style=\"display: inline-flex; align-items: center; gap: 8px; border: 1px solid #CFE4AE; border-radius: 12px; padding: 2px 4px\">\n                        <button onClick=\"{{p.dec}}\" style=\"background: transparent; color: #5A6B4A; font-size: 14px; width: 18px; line-height: 1\">&#8722;</button>\n                        <span class=\"num\" style=\"font-size: 13px; font-weight: 600; min-width: 22px; text-align: center\">{{p.qty}}</span>\n                        <button onClick=\"{{p.inc}}\" style=\"background: transparent; color: #5A6B4A; font-size: 14px; width: 18px; line-height: 1\">+</button>\n                      </div>\n                    </td>\n                    <td class=\"td num\" style=\"text-align: right\">{{p.pu}}</td>\n                    <td class=\"td num\" style=\"text-align: right; font-weight: 600\">{{p.total}}</td>\n                  </tr>\n                </sc-for>\n              </tbody>\n            </table>\n            <div style=\"border-top: 1px solid #DCEBC2; background: #F6FCEA; padding: 12px 15px; display: flex; align-items: center; gap: 14px\">\n              <span style=\"font-size: 12px; color: #5A6B4A\">Budget mensuel nourriture consomm&#233; : <span class=\"num\" style=\"font-weight: 600; color: #1C2610\">{{budgetUsed}}</span> / 2 400 000</span>\n              <span style=\"flex-grow: 1\"></span>\n              <div style=\"text-align: right\">\n                <div class=\"lbl\">Total commande</div>\n                <div class=\"num\" style=\"font-size: 19px; font-weight: 700\">{{propoTotal}}</div>\n              </div>\n              <button style=\"background: #4A8C14; color: #FFFFFF; font-size: 12px; font-weight: 500; padding: 8px 15px; border-radius: 999px\">Soumettre au DG</button>\n            </div>\n          </div>\n          <div class=\"card\" style=\"padding: 14px 15px\">\n            <div class=\"lbl\" style=\"margin-bottom: 10px\">Fiche fournisseur</div>\n            <sc-for list=\"{{supplier}}\" as=\"f\" hint-placeholder-count=\"7\">\n              <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F0F8E2\">\n                <span style=\"font-size: 12px; color: #5A6B4A\">{{f.label}}</span>\n                <span class=\"num\" style=\"font-size: 12px; font-weight: 600; text-align: right; color: {{f.color}}\">{{f.value}}</span>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n        </sc-if>\n\n        <sc-if value=\"{{achIsPR}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px\">\n          <div class=\"card\" style=\"padding: 15px\">\n            <div class=\"lbl\" style=\"margin-bottom: 11px\">Fiscalit&#233; de la facture</div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px\">\n              <sc-for list=\"{{fiscOpts}}\" as=\"f\" hint-placeholder-count=\"3\">\n                <button onClick=\"{{f.go}}\" style=\"display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 999px; background: {{f.bg}}; border: 1.5px solid {{f.bd}}\">\n                  <span style=\"width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid {{f.dotBd}}; background: {{f.dotBg}}; flex-shrink: 0\"></span>\n                  <span style=\"flex-grow: 1\">\n                    <span style=\"display: block; font-size: 12.5px; font-weight: 600; color: {{f.fg}}\">{{f.label}}</span>\n                    <span class=\"num\" style=\"display: block; font-size: 11px; color: #8AA06E; margin-top: 2px\">{{f.formula}}</span>\n                  </span>\n                </button>\n              </sc-for>\n            </div>\n            <div class=\"lbl\" style=\"margin-bottom: 8px\">Prix factur&#233; TTC</div>\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <button onClick=\"{{prDec}}\" style=\"width: 32px; height: 32px; border-radius: 999px; border: 1px solid #CFE4AE; background: #FFFFFF; color: #5A6B4A; font-size: 16px\">&#8722;</button>\n              <div class=\"num\" style=\"flex-grow: 1; text-align: center; font-size: 19px; font-weight: 700\">{{prBase}}</div>\n              <button onClick=\"{{prInc}}\" style=\"width: 32px; height: 32px; border-radius: 999px; border: 1px solid #CFE4AE; background: #FFFFFF; color: #5A6B4A; font-size: 16px\">+</button>\n            </div>\n          </div>\n          <div class=\"card\" style=\"padding: 15px; display: flex; flex-direction: column\">\n            <div class=\"lbl\" style=\"margin-bottom: 12px\">Calcul du prix de revient &#8212; Beurre en plaquette</div>\n            <sc-for list=\"{{prSteps}}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F0F8E2\">\n                <span style=\"font-size: 12.5px; color: #5A6B4A; width: 210px; flex-shrink: 0\">{{s.label}}</span>\n                <span class=\"num\" style=\"font-size: 11px; color: #8AA06E; flex-grow: 1\">{{s.detail}}</span>\n                <span class=\"num\" style=\"font-size: 14px; font-weight: 600; color: {{s.color}}\">{{s.value}}</span>\n              </div>\n            </sc-for>\n            <div style=\"flex-grow: 1\"></div>\n            <div style=\"display: flex; gap: 12px; margin-top: 14px\">\n              <div style=\"flex-grow: 1; background: #1C2610; border-radius: 12px; padding: 13px 15px\">\n                <div class=\"lbl\" style=\"color: #8AA06E\">Prix de revient / carton</div>\n                <div class=\"num\" style=\"font-size: 24px; font-weight: 700; color: #F3FBE3\">{{prCarton}}</div>\n              </div>\n              <div style=\"flex-grow: 1; background: #FDEEDC; border: 1px solid #F5D3AE; border-radius: 12px; padding: 13px 15px\">\n                <div class=\"lbl\" style=\"color: #9C4E0B\">PR / plaquette (12 par carton)</div>\n                <div class=\"num\" style=\"font-size: 24px; font-weight: 700; color: #9C4E0B\">{{prUnit}}</div>\n              </div>\n            </div>\n          </div>\n        </div>\n        </sc-if>\n\n      </div>\n      </sc-if>\n\n      <!-- ---------- COMPTA & REGLEMENTS ---------- -->\n      <sc-if value=\"{{isCompta}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; height: 100%; overflow: auto\">\n\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between\">\n          <div>\n            <h1 style=\"margin: 0 0 3px 0; font-size: 24px; font-weight: 700; letter-spacing: 0\">Comptabilit&#233; &amp; r&#232;glements</h1>\n            <div style=\"font-size: 12px; color: #5A6B4A\">&#201;critures en brouillon jusqu&#8217;&#224; validation de la fiscalit&#233; &#183; lettrage automatique commande / facture / r&#232;glement</div>\n          </div>\n          <div style=\"display: flex; gap: 8px\">\n            <button style=\"background: #FFFFFF; border: 1px solid #CFE4AE; color: #1C2610; font-size: 12px; font-weight: 500; padding: 7px 13px; border-radius: 999px\">Journal des achats</button>\n            <button style=\"background: #FFFFFF; border: 1px solid #CFE4AE; color: #1C2610; font-size: 12px; font-weight: 500; padding: 7px 13px; border-radius: 999px\">Acc&#232;s expert-comptable</button>\n          </div>\n        </div>\n\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px; flex-grow: 1; min-height: 0\">\n\n          <div style=\"display: flex; flex-direction: column; gap: 14px; min-height: 0\">\n            <div class=\"card\" style=\"overflow: hidden\">\n              <div style=\"padding: 12px 15px; border-bottom: 1px solid #E9F4D6; display: flex; align-items: center; gap: 10px\">\n                <span style=\"font-size: 13px; font-weight: 600\">Facture fournisseur FA-2026-0731</span>\n                <span style=\"background: #FDEEDC; color: #9C4E0B; border: 1px solid #F5D3AE; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px\">BROUILLON</span>\n                <span style=\"flex-grow: 1\"></span>\n                <span class=\"num\" style=\"font-size: 11px; color: #8AA06E\">Libell&#233; CF-0905 / FA-2026-0731 &#183; scan joint</span>\n              </div>\n              <table style=\"width: 100%\">\n                <thead>\n                  <tr style=\"background: #F6FCEA\">\n                    <th class=\"th\" style=\"padding-top: 10px\">Compte</th>\n                    <th class=\"th\" style=\"padding-top: 10px\">Libell&#233;</th>\n                    <th class=\"th\" style=\"padding-top: 10px\">Fiscalit&#233;</th>\n                    <th class=\"th\" style=\"padding-top: 10px; text-align: right\">D&#233;bit</th>\n                    <th class=\"th\" style=\"padding-top: 10px; text-align: right\">Cr&#233;dit</th>\n                  </tr>\n                </thead>\n                <tbody>\n                  <sc-for list=\"{{entries}}\" as=\"e\" hint-placeholder-count=\"3\">\n                    <tr>\n                      <td class=\"td num\" style=\"font-weight: 600; color: {{e.accColor}}\">{{e.account}}</td>\n                      <td class=\"td\" style=\"font-size: 12.5px\">{{e.label}}</td>\n                      <td class=\"td\" style=\"font-size: 11px; color: #8AA06E\">{{e.fisc}}</td>\n                      <td class=\"td num\" style=\"text-align: right; font-weight: 500\">{{e.debit}}</td>\n                      <td class=\"td num\" style=\"text-align: right; font-weight: 500\">{{e.credit}}</td>\n                    </tr>\n                  </sc-for>\n                </tbody>\n              </table>\n              <div style=\"border-top: 1px solid #DCEBC2; background: #F6FCEA; padding: 10px 15px; display: flex; align-items: center; gap: 12px\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A8C14\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5 13l4 4L19 7\"></path></svg>\n                <span style=\"font-size: 12px; color: #5A6B4A\">Fiscalit&#233; conforme &#224; la fiche fournisseur (TVA 18 %)     this.baseLines().forEach((l) => { if (l.id === 'l3' || l.id === 'l4' || l.id === 'l6') food += l.qty * l.pu; });
