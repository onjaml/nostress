<script>
window.__TEMPLATE__ = "\n\n\n<div style=\"width: 1120px; height: 2276px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; background: #F3FBE3; overflow: hidden\">\n\n  <div>\n    <h1 style=\"margin: 0 0 4px 0; font-size: 24px; font-weight: 700; letter-spacing: 0\">Composants — terrain et retours</h1>\n    <div style=\"font-size: 12px; color: #5A6B4A\">Les briques de l’app Android (serveur, cuisine, bar, caisse, animateur), le bloc de normalisation de la facture, et les retours visuels qui manquent encore aux maquettes. <span class=\"gap\">En rouge</span> : les écarts à la règle de l’orange.</div>\n  </div>\n\n  <!-- ============ SERVEUR : LIEU, CARTE, OPTIONS ============ -->\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Tuiles de lieu</div><span class=\"src\">Mobile · serveur</span></div>\n      <div class=\"hs\">60 px de haut, rayon 18 px, quatre par ligne. Libre en blanc, servie ou en cuisine en bleu, groupe en lime ; la tuile touchée passe en encre.</div>\n      <div class=\"phone\">\n        <div class=\"lbl\">Lieu de livraison</div>\n        <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px\">\n          <sc-for list=\"{{tables}}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div style=\"height: 60px; border-radius: 18px; background: {{t.bg}}; border: 1.5px solid {{t.bd}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\">\n              <span class=\"num\" style=\"font-size: 14px; font-weight: 600; color: {{t.fg}}\">{{t.n}}</span>\n              <span style=\"font-size: 8.5px; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.subFg}}\">{{t.state}}</span>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Pastilles de choix</div><span class=\"src\">Mobile · carte, détail</span></div>\n      <div class=\"hs\">Filtres de famille en bande défilante, options d’un plat par groupe : un seul choix par groupe, actif en vert plein, 44 px minimum.</div>\n      <div class=\"phone\">\n        <div style=\"display: flex; gap: 7px; overflow: hidden\">\n          <sc-for list=\"{{families}}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"flex-shrink: 0; min-height: 40px; padding: 0 15px; display: flex; align-items: center; border-radius: 999px; font-size: 12.5px; font-weight: {{o.weight}}; background: {{o.bg}}; color: {{o.fg}}; border: 1.5px solid {{o.bd}}\">{{o.label}}</div>\n          </sc-for>\n        </div>\n        <div class=\"lbl\">Cuisson</div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 7px\">\n          <sc-for list=\"{{cuisson}}\" as=\"o\" hint-placeholder-count=\"3\">\n            <div style=\"min-height: 44px; padding: 0 15px; display: flex; align-items: center; border-radius: 999px; font-size: 13px; font-weight: {{o.weight}}; background: {{o.bg}}; color: {{o.fg}}; border: 1.5px solid {{o.bd}}\">{{o.label}}</div>\n          </sc-for>\n        </div>\n        <div class=\"lbl\">Quantité</div>\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <button style=\"width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #CFE4AE; background: #FFFFFF; color: #1C2610; font-size: 20px\">−</button>\n          <div class=\"num\" style=\"flex-grow: 1; text-align: center; font-size: 22px; font-weight: 700\">2</div>\n          <button style=\"width: 48px; height: 48px; border-radius: 999px; border: 1.5px solid #CFE4AE; background: #FFFFFF; color: #1C2610; font-size: 20px\">+</button>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Ligne de plat</div><span class=\"src\">Mobile · carte</span></div>\n      <div class=\"hs\">Pilule de 62 px : nom et note à gauche, prix et poste de destination à droite. <span class=\"gap\">Écart : les étiquettes ÉCLATÉ, PRODUCTION, PÂTISSERIE sont en orange.</span></div>\n      <div class=\"phone\">\n        <sc-for list=\"{{dishes}}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div style=\"background: #FFFFFF; border: 1px solid #DCEBC2; border-radius: 999px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 62px\">\n            <span style=\"flex-grow: 1; min-width: 0\">\n              <span style=\"display: block; font-size: 14px; font-weight: 600\">{{d.name}}</span>\n              <span style=\"display: block; font-size: 11.5px; color: #8AA06E; margin-top: 3px\">{{d.meta}}</span>\n            </span>\n            <span style=\"text-align: right; flex-shrink: 0\">\n              <span class=\"num\" style=\"display: block; font-size: 14px; font-weight: 600\">{{d.price}}</span>\n              <span style=\"display: block; font-size: 10px; font-weight: 600; color: {{d.tagFg}}; margin-top: 3px\">{{d.tag}}</span>\n            </span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ PANIER, ENVOI, ENCAISSEMENT ============ -->\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Ligne de panier et totaux</div><span class=\"src\">Mobile · panier</span></div>\n      <div class=\"hs\">Quantité, plat, montant ; options en clair ; poste de destination en pastille ; « Retirer » en rouge sans fond. <span class=\"gap\">Écart : la quantité « 2× » est en orange.</span></div>\n      <div class=\"phone\">\n        <sc-for list=\"{{cart}}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div class=\"tile\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px\">\n              <span class=\"num\" style=\"font-size: 13px; font-weight: 700; color: #D4711C\">{{c.q}}×</span>\n              <span style=\"flex-grow: 1; font-size: 14px; font-weight: 600\">{{c.name}}</span>\n              <span class=\"num\" style=\"font-size: 14px; font-weight: 600\">{{c.total}}</span>\n            </div>\n            <div style=\"font-size: 11.5px; color: #5A6B4A; margin-top: 5px; line-height: 1.45\">{{c.opts}}</div>\n            <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 8px\">\n              <span style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.05em; color: {{c.destFg}}; background: {{c.destBg}}; padding: 3px 8px; border-radius: 999px\">{{c.dest}}</span>\n              <span style=\"flex-grow: 1\"></span>\n              <span style=\"color: #C0392B; font-size: 12px; font-weight: 500\">Retirer</span>\n            </div>\n          </div>\n        </sc-for>\n        <div class=\"tile\">\n          <div style=\"display: flex; justify-content: space-between; font-size: 12.5px; color: #5A6B4A; padding: 3px 0\"><span>Total HT</span><span class=\"num\">10 678</span></div>\n          <div style=\"display: flex; justify-content: space-between; font-size: 12.5px; color: #5A6B4A; padding: 3px 0\"><span>TVA 18 %</span><span class=\"num\">1 922</span></div>\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-top: 9px; margin-top: 6px; border-top: 1px solid #E9F4D6\">\n            <span style=\"font-size: 13px; font-weight: 600\">Total TTC</span><span class=\"num\" style=\"font-size: 20px; font-weight: 700\">12 600</span>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Écran de confirmation</div><span class=\"src\">Mobile · envoi</span></div>\n      <div class=\"hs\">Grande coche sur pastille verte, une phrase de conséquence, puis ce que chaque poste a reçu, avec son état à droite.</div>\n      <div class=\"phone\" style=\"align-items: center; text-align: center; gap: 12px\">\n        <div style=\"width: 56px; height: 56px; border-radius: 50%; background: #E8F6D2; display: flex; align-items: center; justify-content: center; margin-top: 6px\">\n          <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A8C14\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 13l4 4L19 7\"></path></svg>\n        </div>\n        <div>\n          <div style=\"font-size: 17px; font-weight: 600\">Commande envoyée</div>\n          <div style=\"font-size: 12.5px; color: #5A6B4A; margin-top: 4px; line-height: 1.5\">Relance automatique jusqu’à validation par chaque poste.</div>\n        </div>\n        <div style=\"width: 100%; display: flex; flex-direction: column; gap: 8px\">\n          <sc-for list=\"{{routing}}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div class=\"tile\" style=\"padding: 11px 13px; display: flex; align-items: center; gap: 11px; text-align: left\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{r.color}}; flex-shrink: 0\"></span>\n              <span style=\"flex-grow: 1\">\n                <span style=\"display: block; font-size: 13px; font-weight: 600\">{{r.poste}}</span>\n                <span style=\"display: block; font-size: 11.5px; color: #8AA06E; margin-top: 2px\">{{r.items}}</span>\n              </span>\n              <span style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: {{r.color}}\">{{r.state}}</span>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Encaissement</div><span class=\"src\">Mobile · caisse</span></div>\n      <div class=\"hs\">Le montant dû en tuile verte pleine, 36 px. Puis facture normalisée Oui / Non et mode de règlement en pilules de 52 px.</div>\n      <div class=\"phone\">\n        <div style=\"background: #4A8C14; border-radius: 22px; padding: 16px 18px\">\n          <div class=\"lbl\" style=\"color: #C4E39A\">Montant à payer — table 12</div>\n          <div class=\"num\" style=\"font-size: 32px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.02em; margin-top: 4px\">17 500</div>\n          <div style=\"color: #DEEFC4; font-size: 11.5px; margin-top: 3px\">FCFA TTC · 5 lignes · service du midi</div>\n        </div>\n        <div class=\"tile\">\n          <div class=\"lbl\" style=\"margin-bottom: 8px\">Facture normalisée personnalisée</div>\n          <div style=\"display: flex; gap: 7px; margin-bottom: 9px\">\n            <div style=\"flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 13px; font-weight: 600; background: #4A8C14; color: #FFFFFF; border: 1.5px solid #4A8C14\">Oui</div>\n            <div style=\"flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #5A6B4A; border: 1.5px solid #CFE4AE\">Non</div>\n          </div>\n          <div style=\"border: 1px solid #DCEBC2; border-radius: 14px; padding: 9px 11px\">\n            <div class=\"lbl\" style=\"margin-bottom: 3px\">IFU du client</div>\n            <div class=\"num\" style=\"font-size: 13.5px; font-weight: 600\">3201456789012</div>\n          </div>\n        </div>\n        <div class=\"tile\">\n          <div class=\"lbl\" style=\"margin-bottom: 8px\">Mode de règlement</div>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px\">\n            <sc-for list=\"{{payModes}}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}}; border: 1.5px solid {{m.bd}}\">{{m.label}}</div>\n            </sc-for>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ ENCARTS, POSTES, ANIMATEUR ============ -->\n  <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Encarts</div><span class=\"src\">Mobile · tous profils</span></div>\n      <div class=\"hs\">Message dans le flux, rayon 16 px. Vert : c’est fait. Pointillé : information sans action. Rouge : bloquant. <span class=\"gap\">Écart : les conseils de vente et l’alerte Mobile Money sont en orange.</span></div>\n      <div style=\"display: flex; flex-direction: column; gap: 9px\">\n        <div style=\"background: #E8F6D2; border: 1px solid #C4E39A; border-radius: 16px; padding: 12px 13px; display: flex; gap: 10px; align-items: flex-start\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A8C14\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 1px\"><path d=\"M5 13l4 4L19 7\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #31610D; line-height: 1.45\">Facture <span class=\"num\" style=\"font-weight: 700\">FN-2026-04188</span> imprimée avec la mention Momo.</div>\n        </div>\n        <div style=\"background: #FFFFFF; border: 1px dashed #CFE4AE; border-radius: 16px; padding: 12px 13px\">\n          <div class=\"lbl\" style=\"margin-bottom: 4px\">Groupe ONG Sikadi — déjeuner 12:30</div>\n          <div style=\"font-size: 12.5px; color: #5A6B4A; line-height: 1.45\">Répartition saisie : 21 poulet braisé, 14 poisson grillé.</div>\n        </div>\n        <div style=\"background: #FBEAE7; border: 1px solid #F2C9C2; border-radius: 16px; padding: 12px 13px; display: flex; gap: 10px; align-items: flex-start\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 8v5\"></path><path d=\"M12 17h.01\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #8E271B; line-height: 1.45\">Bière 65 cl en rupture : prévenir le client avant l’envoi.</div>\n        </div>\n        <div style=\"background: #FEF6EC; border: 1px solid #F5D3AE; border-radius: 16px; padding: 12px 13px; display: flex; gap: 10px; align-items: flex-start\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#D4711C\" stroke-width=\"1.9\" stroke-linecap=\"round\" style=\"flex-shrink: 0; margin-top: 1px\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg>\n          <div style=\"font-size: 12.5px; color: #8A4508; line-height: 1.45\">Cuisson estimée <span class=\"num\" style=\"font-weight: 700\">18 min</span>. Proposer un apéritif.</div>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Tickets de poste</div><span class=\"src\">Mobile · cuisine, bar</span></div>\n      <div class=\"hs\">Version Android du ticket : talon gauche de 4 px à la couleur du chrono. Au bar : stock en clair, nature en pastille, Rupture en rouge face à Servi en vert.</div>\n      <div class=\"phone\">\n        <div style=\"background: #FFFFFF; border: 1px solid #DCEBC2; border-left: 4px solid #C0392B; border-radius: 16px; overflow: hidden\">\n          <div style=\"padding: 10px 13px; display: flex; align-items: center; gap: 10px; background: #F6FCEA\">\n            <span class=\"num\" style=\"font-size: 15px; font-weight: 700\">Table 07</span>\n            <span style=\"font-size: 11px; color: #5A6B4A\">Serveur Estelle</span>\n            <span style=\"flex-grow: 1\"></span>\n            <span class=\"num\" style=\"font-size: 15px; font-weight: 700; color: #C03
