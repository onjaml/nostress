        const on = S.site === p.id;
        return { label: p.label, note: p.note, pick: pick(p.id),
          bg: on ? '#F1F9E1' : '#FFFFFF', bd: on ? '#4A8C14' : '#DCEBC2', ring: on ? '#4A8C14' : '#CFE4AE', dot: on ? '#4A8C14' : 'transparent' };
      }),
      goBg: locked ? '#B5C99A' : '#4A8C14',
      goLabel: locked ? 'Compte bloqué' : 'Se connecter',
      toggleEye: () => {
        const v = (document.getElementById('cx-user') || {}).value || '';
        this.setState({ eye: !S.eye, user: v });
      },
      submit: () => {
        if (locked) return;
        const u = ((document.getElementById('cx-user') || {}).value || '').trim();
        const p = (document.getElementById('cx-pass') || {}).value || '';
        if (!u || !p) { this.setState({ user: u, userErr: !u, passErr: !p, alert: null }); return; }
        const acc = accounts[u.toLowerCase()];
        // Mot de passe correct : le code de vérification (2FA) est toujours demandé ensuite
        if (acc && p === 'nostress') { window.location.href = 'verification-2fa.html?u=' + u.toLowerCase() + '&site=' + S.site; return; }
        this.setState({ user: u, tries: S.tries + 1, alert: 'bad', userErr: false, passErr: false });
      }
    };
  }
}


__instance = new Component({});
if (!__instance.state) __instance.state = {};
__render();

})();
</script>
