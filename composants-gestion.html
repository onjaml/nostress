<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F3FBE3; color: #1C2610; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; border: 0; }
    .num { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace; font-variant-numeric: tabular-nums; }
    .lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #8AA06E; }
    .card { background: #FFFFFF; border: 1px solid #DCEBC2; border-radius: 20px; }
    .h { font-size: 13px; font-weight: 600; margin-bottom: 4px }
    .hs { font-size: 11.5px; color: #5A6B4A; margin-bottom: 13px; line-height: 1.45 }
    .src { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; color: #8AA06E }
    .gap { color: #8E271B; font-weight: 600 }
    .hd { display: flex; align-items: baseline; gap: 10px }
    h1 { font-family: 'Baloo 2', 'Plus Jakarta Sans', sans-serif; font-weight: 700; line-height: 1.15; }
    .th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #8AA06E; padding: 8px 12px; background: #F6FCEA }
    .td { font-size: 13px; padding: 9px 12px; border-top: 1px solid #E9F4D6 }
    .cx-box { display: flex; align-items: center; height: 46px; background: #FFFFFF; border: 1px solid #CFE4AE; border-radius: 12px; overflow: hidden; font-size: 14px; color: #1C2610 }
    .cx-box.foc { border-color: #4A8C14; box-shadow: 0 0 0 3px #DDF3AE }
    .cx-box.err { border-color: #C0392B; box-shadow: 0 0 0 3px #FBEAE7 }
    .cx-box.off { background: #F6FCEA; border-color: #E9F4D6; color: #9DB083 }
    .cx-ico { display: flex; padding: 0 9px 0 13px; color: #8AA06E }
    .cx-eye { display: flex; align-items: center; justify-content: center; width: 42px; height: 100%; color: #6F9448; border-left: 1px solid #E9F4D6; margin-left: auto }
    .cx-otp { display: flex; gap: 6px; align-items: center }
    .cx-otp span { width: 40px; height: 48px; border-radius: 12px; border: 1px solid #CFE4AE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; font-weight: 600 }
    .cx-otp span.on { border-color: #4A8C14; box-shadow: 0 0 0 3px #DDF3AE }
    .cx-otp.err span { border-color: #C0392B; box-shadow: 0 0 0 3px #FBEAE7; color: #8E271B }
    .cx-otp.ok span { border-color: #4A8C14; background: #F1F9E1; color: #31610D }
    .cx-otp i { width: 8px; height: 2px; background: #CFE4AE; border-radius: 2px }
    .cx-rule { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #8AA06E }
    .cx-rule b { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #CFE4AE; background: #FFFFFF; flex-shrink: 0 }
    .cx-rule.ok { color: #31610D }
    .cx-rule.ok b { background: #4A8C14; border-color: #4A8C14; box-shadow: inset 0 0 0 2px #FFFFFF }
  </style>
<style>
  html { background: #DEDAD2; }
  body.dc-page { display: flex; justify-content: center; padding: 34px 20px 44px 20px; }
  #app { box-shadow: 0 1px 2px rgba(27,36,48,.10), 0 12px 34px rgba(27,36,48,.14); }
  .dc-back { position: fixed; top: 12px; left: 12px; z-index: 99; display: inline-flex; align-items: center; gap: 6px;
    background: #1B2430; color: #F4F2EE; font: 600 11px/1 'IBM Plex Sans', system-ui, sans-serif;
    letter-spacing: .04em; padding: 8px 12px 8px 9px; border-radius: 20px; text-decoration: none; }
  .dc-back:hover { background: #2E3844; color: #F4F2EE; }
  @media print { .dc-back { display: none } html, body.dc-page { background: #fff; padding: 0 } #app { box-shadow: none } }

<script>
window.__TEMPLATE__ = "\n\n\n<div style=\"width: 1120px; height: 3417px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; background: #F3FBE3; overflow: hidden\">\n\n  <div>\n    <h1 style=\"margin: 0 0 4px 0; font-size: 24px; font-weight: 700; letter-spacing: 0\">Composants — gestion</h1>\n    <div style=\"font-size: 12px; color: #5A6B4A\">Les briques propres aux modules du poste de gestion : connexion, planning, accueil, cotation, achats, comptabilité, fichiers de base. <span class=\"gap\">En rouge</span> : les écarts à la règle de l’orange relevés dans les écrans.</div>\n  </div>\n\n  <!-- ============ GRILLE DE PLANNING ============ -->\n  <div class=\"card\" style=\"padding: 16px 18px\">\n    <div class=\"hd\"><div class=\"h\">Grille de planning</div><span class=\"src\">Main · planning</span></div>\n    <div class=\"hs\">Une ligne par chambre, salle ou prestation, sept colonnes de jours. Aujourd’hui est teinté, le week-end grisé. Les barres sont des pilules avec un talon de 3 px : bleu confirmé, orange provisoire (attend une confirmation), vert groupe ou repas, gris bloqué. <span class=\"gap\">Écart : la date du jour et le « provisoire » (qui attend le client, pas le DG) sont en orange.</span></div>\n    <div style=\"border: 1px solid #DCEBC2; border-radius: 16px; overflow: hidden\">\n      <div style=\"display: flex; border-bottom: 1px solid #DCEBC2; background: #F6FCEA\">\n        <div class=\"lbl\" style=\"width: 132px; flex-shrink: 0; padding: 8px 12px; border-right: 1px solid #DCEBC2\">Chambre</div>\n        <div style=\"flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))\">\n          <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div style=\"padding: 8px 0; text-align: center; border-right: 1px solid #E9F4D6; background: {{d.bg}}\">\n              <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8AA06E\">{{d.dow}}</div>\n              <div class=\"num\" style=\"font-size: 13px; font-weight: 600; color: {{d.fg}}\">{{d.num}}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n      <sc-for list=\"{{planRows}}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"display: flex; border-bottom: 1px solid #F0F8E2; min-height: 40px\">\n          <div style=\"width: 132px; flex-shrink: 0; padding: 8px 12px; border-right: 1px solid #DCEBC2; display: flex; flex-direction: column; justify-content: center\">\n            <div style=\"font-size: 12px; font-weight: 600\">{{r.name}}</div>\n            <div style=\"font-size: 10px; color: #8AA06E\">{{r.meta}}</div>\n          </div>\n          <div style=\"flex-grow: 1; position: relative\">\n            <div style=\"position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))\">\n              <sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"border-right: 1px solid #F0F8E2; background: {{d.colBg}}\"></div>\n              </sc-for>\n            </div>\n            <div style=\"position: absolute; top: 6px; bottom: 6px; left: {{r.left}}; width: {{r.width}}; background: {{r.bg}}; border: 1px solid {{r.bd}}; border-left: 3px solid {{r.bd}}; border-radius: 999px; padding: 0 8px; display: flex; align-items: center; gap: 6px; overflow: hidden\">\n              <span style=\"font-size: 11px; font-weight: 600; color: {{r.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.label}}</span>\n              <span class=\"num\" style=\"font-size: 10px; color: {{r.metaFg}}; white-space: nowrap\">{{r.bmeta}}</span>\n            </div>\n          </div>\n        </div>\n      </sc-for>\n      <div style=\"padding: 8px 12px; display: flex; gap: 16px; align-items: center; background: #F6FCEA\">\n        <sc-for list=\"{{planLegend}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 6px\">\n            <span style=\"width: 11px; height: 11px; border-radius: 6px; background: {{l.bg}}; border: 1px solid {{l.bd}}\"></span>\n            <span style=\"font-size: 11px; color: #5A6B4A\">{{l.label}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ ATTRIBUTION DE CHAMBRE + CARTES DE CHOIX ============ -->\n  <div style=\"display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Tuiles d’attribution</div><span class=\"src\">Main · accueil</span></div>\n      <div class=\"hs\">Numéro en mono, état en capitales de 9 px. La chambre choisie passe en encre pleine. Une légende accompagne toujours la grille.</div>\n      <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px\">\n        <sc-for list=\"{{rooms}}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"padding: 10px 4px; border-radius: 16px; background: {{r.bg}}; border: 1.5px solid {{r.bd}}; text-align: center\">\n            <div class=\"num\" style=\"font-size: 13px; font-weight: 600; color: {{r.fg}}\">{{r.n}}</div>\n            <div style=\"font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: {{r.subFg}}; margin-top: 1px\">{{r.state}}</div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #F0F8E2\">\n        <sc-for list=\"{{roomLegend}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 6px\">\n            <span style=\"width: 11px; height: 11px; border-radius: 6px; background: {{l.bg}}; border: 1px solid {{l.bd}}\"></span>\n            <span style=\"font-size: 11px; color: #5A6B4A\">{{l.label}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Cartes de choix</div><span class=\"src\">Main · accueil</span></div>\n      <div class=\"hs\">Choix exclusif entre des cas qui changent la procédure. La carte active est en encre avec ombre. <span class=\"gap\">Écart : l’étiquette « Cas n » active passe en orange.</span></div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n        <sc-for list=\"{{cases}}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"padding: 14px 16px; border-radius: 20px; background: {{c.bg}}; border: 1px solid {{c.bd}}; box-shadow: {{c.shadow}}\">\n            <div class=\"lbl\" style=\"color: {{c.tagFg}}; margin-bottom: 5px\">Cas {{c.n}}</div>\n            <div style=\"font-size: 12.5px; font-weight: 600; line-height: 1.35; color: {{c.fg}}\">{{c.title}}</div>\n            <div style=\"font-size: 11px; color: {{c.subFg}}; margin-top: 4px; line-height: 1.4\">{{c.sub}}</div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ FICHES ============ -->\n  <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px\">\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Tuiles d’identification</div><span class=\"src\">Main · cotation</span></div>\n      <div class=\"hs\">Bandeau de 4 faits clés sous l’en-tête d’un dossier : étiquette, valeur en mono, note.</div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n        <sc-for list=\"{{ident}}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div class=\"card\" style=\"padding: 11px 13px\">\n            <div class=\"lbl\" style=\"margin-bottom: 5px\">{{f.label}}</div>\n            <div class=\"num\" style=\"font-size: 13px; font-weight: 600\">{{f.value}}</div>\n            <div style=\"font-size: 11px; color: #8AA06E; margin-top: 2px\">{{f.note}}</div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"padding: 16px 18px\">\n      <div class=\"hd\"><div class=\"h\">Fiche détail</div><span class=\"src\">Main · fichiers de base</span></div>\n      <div class=\"hs\">Lecture d’une fiche : nature, nom, sous-titre et Modifier à droite ; champs sur 3 colonnes ; un bloc lime pâle pour la donnée liée.</div>\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px\">\n        <div>\n          <div class=\"lbl\" style=\"margin-bottom: 4px\">Article</div>\n          <div style=\"font-size: 17px; font-weight: 600\">Beurre — carton de 12 plaquettes</div>\n          <div style=\"font-size: 12px; color: #5A6B4A; margin-top: 3px\">Alimentaire / Frais · chambre froide</div>\n        </div>\n        <button style=\"background: #FFFFFF; border: 1px solid #CFE4AE; color: #1C2610; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px\">Modifier</button>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px\">\n        <sc-for list=\"{{ficFields}}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div style=\"border-bottom: 1px solid #F0F8E2; padding-bottom: 8px\">\n            <div class=\"lbl\" style=\"margin-bottom: 4px\">{{f.label}}</div>\n            <div style=\"font-size: 13px; font-weight: 500; color: {{f.color}}\">{{f.value}}</div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"margin-top: 14px; background: #F6FCEA; border: 1px solid #DCEBC2; border-radius: 12px; padding: 12px 16px\">\n        <div class=\"lbl\" style=\"margin-bottom: 6px\">Fournisseurs référencés</div>\n        <sc-for list=\"{{ficBlock}}\" as=\"b\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #E9F4D6\">\n            <span style=\"font-size: 12.5px; flex-grow: 1\">{{b.label}}</span>\n            <span class=\"num\" style=\"font-size: 12.5px; font-weight: 600; color: {{b.color}}\">{{b.value}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ PETITES LISTES ============ -->\n  <div class=\"card\" style=\"padding: 16px 18px\">\n    <div class=\"hd\"><div class=\"h\">Petites listes de carte</div><span class=\"src\">Main · cotation, achats, accueil</span></div>\n    <div class=\"hs\">Quatre formes de liste courte, toutes sous une étiquette en capitales : clé / valeur, ligne datée avec montant, rappel à cocher (rond), pièce de dossier avec statut.</div>\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px\">\n      <div>\n        <div class=\"lbl\" style=\"margin-bottom: 8px\">Fiche fournisseur</div>\n        <sc-for list=\"{{supplier}}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F0F8E2\">\n            <span style=\"font-size: 12px; color: #5A6B4A\">{{f.label}}</span>\n            <span class=\"num\" style=\"font-size: 12px; font-weight: 600; text-align: right; color: {{f.color}}\">{{f.value}}</span>\n          </div>\n        </sc-for>\n      </div>\n      <div>\n        <div class=\"lbl\" style=\"margin-bottom: 8px\">Impact trésorerie</div>\n        <sc-for list=\"{{cashPlan}}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid #F0F8E2\">\n            <span style=\"font-size: 12px; color: #5A6B4A; flex-grow: 1\">{{c.label}}</span>\n            <span class=\"num\" style=\"font-size: 11px; color: #8AA06E\">{{c.date}}</span>\n            <span class=\"num\" style=\"font-size: 13px; font-weight: 600; color: {{c.color}}\">{{c.amount}}</span>\n          </div>\n        </sc-for>\n      </div>\n      <div>\n        <div class=\"lbl\" style=\"margin-bottom: 8px\">Rappels programmés</div>\n        <sc-for list=\"{{reminders}}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 9px; padding: 5px 0\">\n            <span style=\"width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid {{r.bd}}; background: {{r.bg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center\">\n              <sc-if value=\"{{r.done}}\" hint-placeholder-val=\"{{true}}\">\n                <svg width=\"9\" height=\"9\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3.5\" stroke-linecap=\"round\"><path d=\"M5 13l4 4L19 7\"></path></svg>\n              </sc-if>\n            </span>\n            <span style=\"font-size: 12px; flex-grow: 1; color: {{r.fg}}\">{{r.label}}</span>\n            <span class=\"num\" style=\"font-size: 11px; color: #8AA06E\">{{r.date}}</span>\n          </div>\n        </sc-for>\n      </div>\n      <div>\n        <div class=\"lbl\" style=\"margin-bottom: 8px\">Pièces scannées</div>\n        <sc-for list=\"{{docs}}\" as=\"d\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; align-items: center; gap: 8px; padding: 5px 0\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{d.color}}\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z\"></path><path d=\"M14 3v5h5\"></path></svg>\n            <span style=\"font-size: 12px; flex-grow: 1\">{{d.label}}</span>\n            <span style=\"font-size: 10px; font-weight: 600; color: {{d.color}}\">{{d.tag}}</span>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n\n  <!-- ============ TABLEAU DE SAISIE + PIED DE TOTAUX ============ -->\n  <div class=\"card\" style=\"padding: 16px 18px\">\n    <div class=\"hd\"><div class=\"h\">Tableau éditable et pied de totaux</div><span class=\"src\">Main · cotation, achats</span></div>\n    <div class=\"hs\">En-tête de carte avec filtre et « + Ligne » ; quantité réglable dans la cellule ; croix de suppression discrète ; pied lime pâle aligné à droite, le total final séparé par un filet et grossi. <span class=\"gap\">Écart : « + Ligne » et la colonne Retour client sont en orange.</span></div>\n    <div style=\"border: 1px solid #DCEBC2; border-radius: 16px; overflow: hidden\">\n      <div style=\"padding: 12px 15px; border-bottom: 1px solid #E9F4D6; display: flex; align-items: center; gap: 10px\">\n        <span style=\"font-size: 13px; font-weight: 600\">Lignes de prestation</span>\n        <span style=\"font-size: 11px; color: #8AA06E\">Chaque ligne porte son compte comptable</span>\n        <span style=\"flex-grow: 1\"></span>\n        <button style=\"background: #FDEEDC; border: 1px solid #F5D3AE; color: #9C4E0B; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px\">+ Ligne</button>\n      </div>\n      <table style=\"width: 100%; border-collapse: collapse\">\n        <thead>\n          <tr>\n            <th class=\"th\">Désignation</th>\n            <th class=\"th\">Compte</th>\n            <th class=\"th\" style=\"text-align: right\">Qté</th>\n            <th class=\"th\" style=\"text-align: right\">PU HT</th>\n            <th class=\"th\" style=\"text-align: right\">Total HT</th>\n            <th class=\"th\" style=\"text-align: right\">Retour client</th>\n            <th class=\"th\"></th>\n          </tr>\n        </thead>\n        <tbody>\n          <sc-for list=\"{{lines}}\" as=\"l\" hint-placeholder-count=\"3\">\n            <tr>\n              <td class=\"td\">\n                <div style=\"font-weight: 500\">{{l.label}}</div>\n                <div style=\"font-size: 11px; color: #8AA06E; margin-top: 1px\">{{l.sub}}</div>\n              </td>\n              <td class=\"td num\" style=\"color: #5A6B4A; font-size: 12px\">{{l.account}}</td>\n              <td class=\"td\" style=\"text-align: right\">\n                <div style=\"display: inline-flex; align-items: center; gap: 8px; border: 1px solid #CFE4AE; border-radius: 12px; padding: 2px 4px\">\n                  <button style=\"background: transparent; color: #5A6B4A; font-size: 14px; width: 18px; line-height: 1\">−</button>\n                  <span class=\"num\" style=\"font-size: 13px; font-weight: 600; min-width: 22px; text-align: center\">{{l.qty}}</span>\n                  <button style=\"background: transparent; color: #5A6B4A; font-size: 14px; width: 18px; line-height: 1\">+</button>\n                </div>\n              </td>\n              <td class=\"td num\" style=\"text-align: right\">{{l.pu}}</td>\n              <td class=\"td num\" style=\"text-align: right; font-weight: 600\">{{l.total}}</td>\n              <td class=\"td num\" style=\"text-align: right; color: #9C4E0B\">{{l.retour}}</td>\n              <td class=\"td\" style=\"text-align: right; width: 34px\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A3B58F\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg>\n              </td>\n            </tr>\n          </sc-for>\n        </tbody>\n      </table>\n      <div style=\"border-top: 1px solid #DCEBC2; background: #F6FCEA; padding: 12px 15px; display: flex; justify-content: flex-end; gap: 30px\">\n        <div style=\"text-align: right\"><div class=\"lbl\">Total HT</div><div class=\"num\" style=\"font-size: 17px; font-weight: 600\">1 872 000</div></div>\n        <div style=\"text-align: right\"><div class=\"lbl\">TVA 18 %</div><div class=\"num\" style=\"font-size: 17px; font-weight: 600\">336 960</div></div>\n        <div style=\"text-align: right\"><div class=\"lbl\">Retour client (rétroc.)</div><div class=\"num\" style=\"font-size: 17px; font-weight: 600; color: #9C4E0B\">93 600</div></div>\n        <div style=\"text-align: right;
