    const mkPlace = (n, state, pal) => ({ n: n, state: state,
      bg: S.place === n ? '#1C2610' : pal[0], bd: S.place === n ? '#1C2610' : pal[1],
      fg: S.place === n ? '#F3FBE3' : pal[2], subFg: S.place === n ? '#AFC697' : pal[3],
      go: () => this.setState({ place: n, step: 'menu' }) });
    const libre = ['#FFFFFF', '#CFE4AE', '#1C2610', '#8AA06E'];
    const occ = ['#E9F2F8', '#C4DCEA', '#22485E', '#7897AB'];
    const grp = ['#EAF7D6', '#C4E39A', '#31610D', '#6F9448'];

    const famList = [['plats', 'Plats'], ['entrees', 'Entrées'], ['petitdej', 'Petit déj.'], ['boissons', 'Boissons'], ['patisserie', 'Pâtisserie']];

    const ticketDefs = [
      { id: 't1', place: 'Table 12', who: 'Serveur Koffi', timer: '04:12', late: false,
        items: [{ q: '2', name: 'Poulet braisé', opts: 'Braisé fort · piment · frites' }, { q: '1', name: 'Riz sauce arachide', opts: 'Piment doux · portion normale' }, { q: '1', name: 'Salade de papaye', opts: 'Sans piment · servie en entrée' }] },
      { id: 't2', place: 'Chambre 104', who: 'Room service · offert', timer: '01:38', late: false,
        items: [{ q: '1', name: 'Omelette', opts: 'Baveuse · fromage' }, { q: '1', name: 'Café', opts: 'Servi avec le plat' }] },
      { id: 't3', place: 'Table 07', who: 'Serveur Estelle', timer: '11:47', late: true,
        items: [{ q: '1', name: 'Poisson grillé', opts: 'Bien grillé · moyo · attiéké' }, { q: '2', name: 'Salade de papaye', opts: 'Piment doux' }] },
      { id: 't4', place: 'Table 03', who: 'Serveur Koffi', timer: '00:22', late: false,
        items: [{ q: '1', name: 'Pizza margherita', opts: 'Poste pâtisserie · bien cuite' }, { q: '1', name: 'Beignets de crevettes', opts: 'Sauce aigre-douce' }] }
    ];

    const barDefs = [
      { id: 'b1', q: '3', name: 'Bière 65 cl', place: 'Table 12', stockLabel: 'Stock bar 34 casiers · consigne suivie', tag: 'STOCKABLE', tagFg: '#31610D', tagBg: '#E8F6D2' },
      { id: 'b2', q: '2', name: 'Jus de bissap maison', place: 'Table 07', stockLabel: 'Production interne · non stockable', tag: 'PRODUCTION', tagFg: '#9C4E0B', tagBg: '#FDEEDC' },
      { id: 'b3', q: '1', name: 'Pizza margherita', place: 'Table 03', stockLabel: 'Poste pâtisserie · 15 min', tag: 'PÂTISSERIE', tagFg: '#9C4E0B', tagBg: '#FDEEDC' },
      { id: 'b4', q: '4', name: 'Eau minérale 1,5 L', place: 'Salle Palmier', stockLabel: 'Stock bar 88 packs', tag: 'STOCKABLE', tagFg: '#31610D', tagBg: '#E8F6D2' }
    ];

    const msgs = ['Prêt dans 10 minutes', 'Pause café maintenant', 'Repas servi en salle Palmier', 'Reprise de la session dans 15 minutes'];

    return {
      // en-tête
      headTitle: title, headSub: sub, headRight: '12:41', headRightSub: 'Lun 07/09',
      canBack: canBack,
      back: () => this.setState({ step: S.step === 'detail' ? 'menu' : (S.step === 'cart' ? 'menu' : 'tables') }),

      // vues
      isTables: isServeur && S.step === 'tables',
      isMenu: isServeur && S.step === 'menu',
      isDetail: isServeur && S.step === 'detail',
      isCart: isServeur && S.step === 'cart',
      isSent: isServeur && S.step === 'sent',
      isCuisine: S.role === 'cuisine',
      isBar: S.role === 'bar',
      isCaisse: S.role === 'caisse',
      isAnim: S.role === 'anim',

      // serveur — lieux
      tables: [['T. 01', 'Libre', libre], ['T. 02', 'Libre', libre], ['T. 03', 'Servie', occ], ['T. 04', 'Libre', libre],
               ['T. 05', 'Libre', libre], ['T. 06', 'Servie', occ], ['T. 07', 'En cuisine', occ], ['T. 08', 'Libre', libre],
               ['T. 12', 'À encaisser', occ], ['Palmier', 'Groupe', grp], ['Cocotier', 'Groupe', grp], ['Plage', 'Libre', libre]]
        .map((t) => mkPlace(t[0], t[1], t[2])),
      roomsRS: [['104', 'Occupée', occ], ['108', 'Occupée', occ], ['111', 'Occupée', occ], ['203', 'Occupée', occ]]
        .map((t) => mkPlace('Ch. ' + t[0], t[1], t[2])),
      goGroupe: () => this.setState({ place: 'Salle Palmier', step: 'menu', fam: 'plats' }),

      // serveur — menu
      families: famList.map((x) => {
        const on = S.fam === x[0], st = this.sel(on);
        return { label: x[1], bg: st.bg, fg: st.fg, bd: st.bd, weight: st.weight, go: () => this.setState({ fam: x[0] }) };
      }),
      dishes: this.catalog()[S.fam].map((x) => ({
        name: x.name, meta: x.meta, price: f(x.price), tag: x.tag, tagFg: x.tagFg,
        go: () => this.setState({ dishId: x.id, step: 'detail', qty: 1, opts: {} })
      })),

      // serveur — détail
      dish: { name: d.name, meta: d.meta, price: f(d.price), cook: d.cook },
      optionGroups: d.groups.map((g) => ({
        label: g[0],
        options: g[1].map((o) => {
          const key = d.id + '-' + g[0];
          const on = (S.opts[key] || g[1][0]) === o, st = this.sel(on);
          return { label: o, bg: st.bg, fg: st.fg, bd: st.bd, weight: st.weight,
            go: () => this.setState({ opts: Object.assign({}, S.opts, { [key]: o }) }) };
        })
      })),
      qty: String(S.qty),
      qtyInc: () => this.setState({ qty: S.qty + 1 }),
      qtyDec: () => this.setState({ qty: Math.max(1, S.qty - 1) }),

      // serveur — panier
      cart: S.cart.map((c, i) => ({
        name: c.name, q: String(c.q), opts: c.opts, total: f(c.q * c.price), dest: c.dest,
        destBg: c.dest === 'BAR' ? '#E8F6D2' : (c.dest === 'PÂTISSERIE' ? '#FDEEDC' : '#E9F2F8'),
        destFg: c.dest === 'BAR' ? '#31610D' : (c.dest === 'PÂTISSERIE' ? '#9C4E0B' : '#3E6E8E'),
        remove: () => this.setState({ cart: S.cart.filter((x, j) => j !== i) })
      })),
      drinkTiming: [['apres', 'Avec les plats'], ['debut', 'Servir en premier']].map((o) => {
        const on = S.drink === o[0], st = this.sel(on);
        return { label: o[1], bg: st.bg, fg: st.fg, bd: st.bd, weight: st.weight, go: () => this.setState({ drink: o[0] }) };
      }),
      cartHT: f(tot.ht), cartTVA: f(tot.tva), cartTTC: f(tot.ttc),

      // serveur — envoyé
      routing: [
        { poste: 'Cuisine', items: 'Relance jusqu’à validation', state: 'ENVOYÉ', color: '#4A8C14' },
        { poste: 'Bar', items: 'Mise à jour du stock à la confirmation', state: 'ENVOYÉ', color: '#4A8C14' },
        { poste: 'Imprimante accueil', items: 'Bon de commande imprimé', state: 'IMPRIMÉ', color: '#3E6E8E' }
      ],

      // cuisine
      tickets: ticketDefs.map((t) => {
        const st = S.tickets[t.id];
        const accent = st === 'ready' ? '#4A8C14' : (t.late ? '#C0392B' : '#D4711C');
        return { place: t.place, who: t.who, timer: t.timer, items: t.items,
          accent: accent, bd: '#DCEBC2', headBg: st === 'ready' ? '#F1F9E1' : '#F6FCEA',
          soonBg: st === 'soon' ? '#D4711C' : '#FFFFFF', soonFg: st === 'soon' ? '#FFFFFF' : '#9C4E0B', soonBd: '#F5D3AE',
          readyBg: st === 'ready' ? '#4A8C14' : '#FFFFFF', readyFg: st === 'ready' ? '#FFFFFF' : '#31610D', readyBd: '#C4E39A',
          readyLabel: st === 'ready' ? 'Confirmé' : 'Prêt',
          soon: () => this.setState({ tickets: Object.assign({}, S.tickets, { [t.id]: 'soon' }) }),
          ready: () => this.setState({ tickets: Object.assign({}, S.tickets, { [t.id]: 'ready' }) }) };
      }),

      // bar
      barItems: barDefs.map((b) => {
        const st = S.bar[b.id];
        return { q: b.q, name: b.name, place: b.place, stockLabel: b.stockLabel, tag: b.tag, tagFg: b.tagFg, tagBg: b.tagBg,
          rBg: st === 'ko' ? '#C0392B' : '#FFFFFF', rFg: st === 'ko' ? '#FFFFFF' : '#C0392B', rBd: '#F2C9C2',
          oBg: st === 'ok' ? '#4A8C14' : '#FFFFFF', oFg: st === 'ok' ? '#FFFFFF' : '#31610D', oBd: '#C4E39A',
          okLabel: st === 'ok' ? 'Mise à disposition confirmée' : 'Disponible',
          rupture: () => this.setState({ bar: Object.assign({}, S.bar, { [b.id]: 'ko' }) }),
          ok: () => this.setState({ bar: Object.assign({}, S.bar, { [b.id]: 'ok' }) }) };
      }),

      // caisse
      payAmount: f(payAmount),
      normOpts: [['Oui', true], ['Non', false]].map((o) => {
        const on = S.norm === o[1], st = this.sel(on);
        return { label: o[0], bg: st.bg, fg: st.fg, bd: st.bd, go: () => this.setState({ norm: o[1], printed: false }) };
      }),
      normOn: S.norm, normOff: !S.norm,
      payModes: [['momo', 'Momo'], ['moov', 'Moov'], ['cash', 'Cash']].map((m) => {
        const on = S.payMode === m[0], st = this.sel(on);
        return { label: m[1], bg: st.bg, fg: st.fg, bd: st.bd, go: () => this.setState({ payMode: m[0], printed: false }) };
      }),
      isMobileMoney: S.payMode !== 'cash',
      printed: S.printed,
      payModeLabel: { momo: 'Momo', moov: 'Moov', cash: 'Cash' }[S.payMode],

      // animateur
      counts: [
        { key: 'pdj', label: 'Petits déjeuners', place: 'Terrasse · 06:30 – 09:00' },
        { key: 'pause', label: 'Pause du matin', place: 'Salle Palmier · 10:00' },
        { key: 'repas', label: 'Déjeuners', place: 'Restaurant · 12:30' }
      ].map((c) => ({ label: c.label, place: c.place, n: String(S.counts[c.key]),
        inc: () => this.setState({ counts: Object.assign({}, S.counts, { [c.key]: S.counts[c.key] + 1 }), countsOk: false }),
        dec: () => this.setState({ counts: Object.assign({}, S.counts, { [c.key]: Math.max(0, S.counts[c.key] - 1) }), countsOk: false }) })),
      confirmCounts: () => this.setState({ countsOk: true }),
      confLabel: S.countsOk ? 'Effectifs confirmés — cuisine et magasin notifiés' : 'Confirmer les effectifs',
      confBg: S.countsOk ? '#31610D' : '#4A8C14',
      confFg: '#F3FBE3',
      confBd: S.countsOk ? '#31610D' : '#4A8C14',
      messages: msgs.map((m) => {
        const on = S.lastMsg === m, st = this.sel(on);
        return { label: m, bg: st.bg, fg: st.fg, bd: st.bd, go: () => this.setState({ lastMsg: m }) };
      }),
      msgSent: !!S.lastMsg,
      lastMsg: S.lastMsg || '',

      // barre d'action + profils
      hasAction: hasAction, actionLabel: actionLabel, actionValue: actionValue, actionText: actionText, actionGo: actionGo,
      roles: [
        { id: 'serveur', label: 'Serveur', icon: 'M3 11h18a9 9 0 00-18 0zM2 15h20M5 19h14' },
        { id: 'cuisine', label: 'Cuisine', icon: 'M4 10h16v6a4 4 0 01-4 4H8a4 4 0 01-4-4zM2 10h20M8 6V3M12 6V3M16 6V3' },
        { id: 'bar', label: 'Bar', icon: 'M5 4h14l-7 8zM12 12v8M8 20h8' },
        { id: 'caisse', label: 'Caisse', icon: 'M3 7h18v10H3zM3 11h18M7 15h3' },
        { id: 'anim', label: 'Animateur', icon: 'M3 11l13-6v14L3 13zM3 11v3M7 14v4a2 2 0 004 0' }
      ].map((r) => {
        const on = S.role === r.id;
        return { label: r.label, icon: r.icon, stroke: on ? '#D4711C' : '#A9BE90',
          fg: on ? '#1C2610' : '#8AA06E', weight: on ? '600' : '500',
          go: () => this.setState({ role: r.id, step: 'tables', cart: S.cart }) };
      })
    };
  }
}
